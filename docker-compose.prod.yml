services:
  workspace-worker:
    image: ${BACKEND_IMAGE:-ai-edu-backend}:${IMAGE_TAG:-latest}
    environment:
      DEBUG: "false"
  import-worker:
    image: ${IMPORT_WORKER_IMAGE:-ai-edu-import-worker}:${IMAGE_TAG:-latest}
    environment:
      DEBUG: "false"
  minio-init:
    image: ${BACKEND_IMAGE:-ai-edu-backend}:${IMAGE_TAG:-latest}
  backend:
    image: ${BACKEND_IMAGE:-ai-edu-backend}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    command: ["sh", "-c", "python manage.py collectstatic --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"]
    environment:
      DEBUG: "false"
    volumes: [static_data:/app/staticfiles]
    ports: !override ["127.0.0.1:4000:8000"]
volumes:
  static_data:
    name: aiedu-static
