name: backend-ci-cd

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: aiedu
          POSTGRES_USER: aiedu
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aiedu -d aiedu"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DEBUG: "true"
      SECRET_KEY: ci-only-not-a-production-secret-key
      ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_NAME: aiedu
      DATABASE_USER: aiedu
      DATABASE_PASSWORD: ci-only-password
      DATABASE_HOST: 127.0.0.1
      DATABASE_PORT: "5432"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-import-core.txt
            requirements-test.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt -r requirements-import-core.txt -r requirements-test.txt
      - name: Check Django configuration
        run: python manage.py check
      - name: Check migration files
        run: python manage.py makemigrations --check --dry-run
      - name: Check server-only tutor configuration
        run: python -m unittest discover -s ops -p 'test_*.py'
      - name: Run tests
        run: python manage.py test --settings=config.settings_test --parallel 2 --noinput --durations 15 --timing
      - name: Validate OpenAPI schema
        run: python manage.py spectacular --validate --file /tmp/openapi.yml

  verify-ai:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai-tutor
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: services/ai-tutor/package-lock.json
      - name: Install AI service dependencies
        run: npm ci
      - name: Build AI service without production credentials
        run: npm run build
        env:
          OPENAI_API_KEY: build-only-placeholder
          AI_DB_PROVIDER: sqlite

  verify-avatar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/avatar-local
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: services/avatar-local/package-lock.json
      - name: Install local avatar dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Check synthetic playback and local-only configuration
        run: npm test
      - name: Validate worker Python syntax without launching NVIDIA
        run: python -m py_compile audio2face-stream.py

  verify-cloud-avatar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: services/avatar-gateway/package-lock.json
      - name: Install private gateway dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --prefix services/avatar-gateway
      - name: Check streamed speech, quotas and private avatar transport
        run: node --test services/voice-worker/speech.test.mjs services/avatar-gateway/gateway.test.cjs

  publish:
    needs: [verify, verify-ai, verify-avatar, verify-cloud-avatar]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
      import_image: ${{ steps.image.outputs.name }}-import-worker
      ai_image: ${{ steps.image.outputs.name }}-ai-tutor
    steps:
      - uses: actions/checkout@v6
      - name: Set image name
        id: image
        shell: bash
        run: echo "name=ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build and publish lecture OCR worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.import-worker
          load: true
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ steps.image.outputs.name }}-import-worker:${{ github.sha }}
            ${{ steps.image.outputs.name }}-import-worker:latest
          cache-from: type=gha,scope=import-worker
          cache-to: type=gha,mode=max,scope=import-worker
      - name: Verify PDF and embedded-image OCR in the worker image
        timeout-minutes: 20
        run: docker run --rm -e DEBUG=true -e RUN_LECTURE_OCR_TESTS=1 "${{ steps.image.outputs.name }}-import-worker:${{ github.sha }}" python manage.py test apps.lessons.test_import_ocr --noinput
      - name: Build and publish AI gateway
        uses: docker/build-push-action@v6
        with:
          context: services/ai-tutor
          load: true
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ steps.image.outputs.name }}-ai-tutor:${{ github.sha }}
            ${{ steps.image.outputs.name }}-ai-tutor:latest
          cache-from: type=gha,scope=ai-tutor
          cache-to: type=gha,mode=max,scope=ai-tutor
      - name: Check gateway image health, authentication and writable database
        env:
          AI_IMAGE: ${{ steps.image.outputs.name }}-ai-tutor:${{ github.sha }}
        run: |
          set -euo pipefail
          docker run -d --name tutor-ci -p 127.0.0.1:3301:3001 -e OPENAI_API_KEY=ci-only-placeholder -e API_SHARED_KEY=ci-only-service-key -e AI_DB_PROVIDER=sqlite "$AI_IMAGE"
          trap 'docker logs tutor-ci; docker rm -f tutor-ci' EXIT
          python validation/tutor_image_smoke.py

  deploy:
    if: github.event_name == 'push'
    needs: publish
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: backend-production-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
      - name: Deploy backend to server
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          BACKEND_IMAGE: ${{ needs.publish.outputs.image }}
          IMPORT_WORKER_IMAGE: ${{ needs.publish.outputs.import_image }}
          AI_TUTOR_IMAGE: ${{ needs.publish.outputs.ai_image }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "$OPENAI_API_KEY" || { echo 'OPENAI_API_KEY repository secret is required'; exit 1; }
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          eval "$(ssh-agent -s)"
          trap 'ssh-agent -k' EXIT
          printf '%s\n' "$DEPLOY_SSH_KEY" | ssh-add -
          scp -o BatchMode=yes docker-compose.yml docker-compose.prod.yml "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"
          ssh -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$DEPLOY_PATH/ops'"
          scp -o BatchMode=yes ops/configure_tutor.py "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/ops/"
          {
            printf 'cd %q\n' "$DEPLOY_PATH"
            printf 'export BACKEND_IMAGE=%q\n' "$BACKEND_IMAGE"
            printf 'export IMPORT_WORKER_IMAGE=%q\n' "$IMPORT_WORKER_IMAGE"
            printf 'export AI_TUTOR_IMAGE=%q\n' "$AI_TUTOR_IMAGE"
            printf 'export OPENAI_API_KEY=%q\n' "$OPENAI_API_KEY"
            printf 'export IMAGE_TAG=%q\n' "$IMAGE_TAG"
            printf 'export GHCR_USERNAME=%q\n' "$GHCR_USERNAME"
            printf 'export GHCR_PULL_TOKEN=%q\n' "$GHCR_PULL_TOKEN"
            cat <<'REMOTE'
          set -euo pipefail
          umask 077
          python3 ops/configure_tutor.py
          unset OPENAI_API_KEY
          echo "$GHCR_PULL_TOKEN" | docker login ghcr.io --username "$GHCR_USERNAME" --password-stdin
          docker compose -f docker-compose.yml -f docker-compose.prod.yml pull backend minio-init workspace-worker import-worker ai-tutor
          docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --no-deps --no-build --wait --wait-timeout 120 db
          docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --no-deps --no-build --wait --wait-timeout 120 ai-tutor
          docker compose -f docker-compose.yml -f docker-compose.prod.yml run --rm backend python manage.py migrate --noinput </dev/null
          docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --no-deps --no-build --wait --wait-timeout 120 backend workspace-worker import-worker
          backend_container_id="$(docker compose -f docker-compose.yml -f docker-compose.prod.yml ps -q backend)"
          test -n "$backend_container_id"
          test "$(docker inspect --format '{{.State.Status}}' "$backend_container_id")" = running
          workspace_worker_container_id="$(docker compose -f docker-compose.yml -f docker-compose.prod.yml ps -q workspace-worker)"
          test -n "$workspace_worker_container_id"
          test "$(docker inspect --format '{{.State.Status}}' "$workspace_worker_container_id")" = running
          docker compose -f docker-compose.yml -f docker-compose.prod.yml exec -T backend python -c "import os, json, urllib.request; os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'config.settings'); from django.conf import settings; response=urllib.request.urlopen(settings.AI_SERVICE_URL + '/api/health', timeout=10); assert response.status == 200; assert settings.AI_SERVICE_API_KEY; print('Tutor health verified from backend')"
          docker compose -f docker-compose.yml -f docker-compose.prod.yml ps backend workspace-worker ai-tutor
          docker logout ghcr.io
          REMOTE
          } | ssh -o BatchMode=yes "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s'
