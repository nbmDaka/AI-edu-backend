name: ai-edu
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
  minio:
    image: codemowers/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes: [minio_data:/data]
    ports: ["127.0.0.1:9001:9001"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20
  minio-init:
    build: .
    depends_on: {minio: {condition: service_healthy}}
    env_file: .env
    environment:
      S3_ENDPOINT_URL: http://minio:9000
    entrypoint: ["python", "create_bucket.py"]
  backend:
    build: .
    env_file: .env
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}
    ports: ["127.0.0.1:8000:8000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request\nrequest = urllib.request.Request('http://127.0.0.1:8000/api/v1/csrf/', headers={'X-Forwarded-Proto': 'https'})\nwith urllib.request.urlopen(request, timeout=3) as response:\n    if response.status != 200:\n        raise SystemExit(1)"]
      interval: 10s
      timeout: 5s
      retries: 20
  workspace-worker:
    build: .
    command: ["python", "manage.py", "run_workspace_worker"]
    env_file: .env
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
    depends_on:
      backend: {condition: service_healthy}
    init: true
    restart: unless-stopped
  import-worker:
    build:
      context: .
      dockerfile: Dockerfile.import-worker
    env_file: .env
    environment:
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
    depends_on:
      backend: {condition: service_healthy}
    volumes: [import_models:/models]
    mem_limit: 4g
    cpus: 2
    init: true
    restart: unless-stopped
volumes:
  import_models:
  postgres_data:
    name: ai-edu_postgres_data
  minio_data:
    name: ai-edu_minio_data
networks:
  default:
    name: aiedu-platform
