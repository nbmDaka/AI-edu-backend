<!doctype html>
<html lang="ru">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{ title }}</title></head>
<body style="margin:0;padding:32px 16px;background:#f4f6fa;font-family:Arial,Helvetica,sans-serif;color:#1e2b44">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0"><tr><td align="center">
    <table role="presentation" width="560" cellpadding="0" cellspacing="0" style="width:100%;max-width:560px;background:#fffefa;border:1px solid #d9e0ea;border-radius:16px">
      <tr><td style="padding:28px 32px;background:#293b78;border-radius:16px 16px 0 0;color:#fff;font-size:24px;font-weight:bold">AI <span style="color:#f1b84c">Edu</span></td></tr>
      <tr><td style="padding:32px">
        <h1 style="margin:0 0 24px;font-size:24px;line-height:1.3">{{ title }}</h1>
        <p style="font-size:15px;line-height:1.7">Здравствуйте{% if name %}, {{ name }}{% endif %}!</p>
        <p style="margin:0 0 28px;font-size:15px;line-height:1.7;color:#526078">{{ body }}</p>
        <table role="presentation" cellpadding="0" cellspacing="0"><tr><td bgcolor="#4058af" style="border-radius:8px"><a href="{{ url }}" style="display:inline-block;padding:14px 22px;border-radius:8px;color:#fff;text-decoration:none;font-size:15px;font-weight:bold">{{ action }}</a></td></tr></table>
        {% if note %}<p style="margin:28px 0 0;font-size:13px;line-height:1.7;color:#65728a">{{ note }}</p>{% endif %}
        <p style="margin:28px 0 8px;font-size:12px;line-height:1.6;color:#7b879d">Если кнопка не работает, скопируйте ссылку в браузер:</p>
        <a href="{{ url }}" style="font-size:12px;line-height:1.7;word-break:break-all;color:#4058af">{{ url }}</a>
      </td></tr>
      <tr><td style="padding:20px 32px;border-top:1px solid #e8edf3;font-size:12px;line-height:1.6;color:#7b879d">AI Edu · Образовательная платформа<br>Это автоматическое письмо. Отвечать на него не нужно.</td></tr>
    </table>
  </td></tr></table>
</body>
</html>
